# Include inside the HTTPS server for lerk.tech (Xray fallback).
location = /pokupki { return 301 /pokupki/; }
location = /pokupki/ { rewrite ^ /pokupki/page.html last; }
location = /pokupki/page.html {
    internal;
    alias /var/www/pokupki/artifacts/shopping-list.html;
    default_type text/html;
    add_header Cache-Control "no-store";
}
location = /pokupki/api {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/pokupki/artifacts/shopping-api.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    client_max_body_size 8k;
}
location /pokupki/ { return 404; }
