# Include inside the HTTPS server for lerk.tech (Xray fallback).
# The page is public and holds no data. Access is checked in PHP: a signed 30-day cookie from the login form
# (shopping-lib.php, /var/lib/pokupki/auth.json). Do not add auth_basic here: the session is the only gate.
location = /pokupki { return 301 /pokupki/; }
location = /pokupki/ { rewrite ^ /pokupki/page.html last; }
location = /pokupki/page.html {
    internal;
    alias /var/www/pokupki/artifacts/shopping-list.html;
    default_type text/html;
    add_header Cache-Control "no-cache";   # the browser keeps a copy but asks nginx first: an unchanged page costs a 304, a new deploy shows at once
}
location = /pokupki/api {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/pokupki/artifacts/shopping-api.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    client_max_body_size 8k;
    gzip on;                       # nginx compresses only text/html by default; the list is JSON
    gzip_types application/json;
    gzip_min_length 512;
}
# Photos: GET ?id=... shows one, POST ?op=add|main|del changes them. The page shrinks pictures before sending.
location = /pokupki/photo {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/pokupki/artifacts/shopping-photo.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    client_max_body_size 4m;
}
location /pokupki/ { return 404; }
